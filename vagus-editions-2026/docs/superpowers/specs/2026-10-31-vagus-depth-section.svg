<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc"><title id="title">首页与AI纵深展页空间剖面</title><desc id="desc">沿y-z轴观察，两幅展页上下错位且前后相隔。相机固定朝向负z，向下向前，从首页下边缘下方通过，到达AI正面阅读位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c56538" stroke-width="1.5"/></marker><pattern id="p" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#c59a68" stroke-width="2"/></pattern></defs><rect width="1600" height="1030" fill="#f2f0e8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="52" font-size="32" fill="#203c33" font-weight="600">Vagus / 纵向展页的空间剖面</text><text x="42" y="87" font-size="18" fill="#273f39" font-weight="400">侧面看：左近右远，上为首页，下为 AI。两画正面朝左；所有人物只使用原有观看角度。</text><text x="42" y="118" font-size="16" fill="#64746b" font-weight="400">几何初值 · 设计待审 · 不是原画真实建筑测量；线宽不代表成品美术</text><path d="M471.8347016809663 315 L900 180 L900 450 Z" fill="#83aca0" fill-opacity=".10" stroke="#8ba899" stroke-dasharray="6 6"/><path d="M951.8347016809663 603 L1380 468 L1380 738 Z" fill="#536fa1" fill-opacity=".09" stroke="#8093b0" stroke-dasharray="6 6"/><line x1="900" y1="180" x2="900" y2="450" stroke="#518875" stroke-width="10"/><line x1="1380" y1="468" x2="1380" y2="738" stroke="#465e87" stroke-width="10"/><path d="M900 443 L919.2 443 L919.2 457 L900 457 Z" fill="url(#p)" stroke="#b77c3d" stroke-dasharray="4 3"/><path d="M1380 461 L1392 461 L1392 475 L1380 475 Z" fill="url(#p)" stroke="#b77c3d" stroke-dasharray="4 3"/><text x="926" y="211" font-size="25" fill="#376b58" font-weight="600">首页展页 A</text><text x="926" y="243" font-size="17" fill="#465b53" font-weight="400">中心 y=0，z=0</text><text x="926" y="271" font-size="17" fill="#465b53" font-weight="400">宽2 / 高1.125</text><text x="926" y="299" font-size="17" fill="#465b53" font-weight="400">原画正面朝向镜头</text><text x="1400" y="532" font-size="22" fill="#465e87" font-weight="600">AI 展页 B</text><text x="1400" y="563" font-size="16" fill="#465e87" font-weight="400">y=−1.20</text><text x="1400" y="589" font-size="16" fill="#465e87" font-weight="400">z=−2.00</text><text x="1400" y="615" font-size="16" fill="#465e87" font-weight="400">同宽同高</text><path d="M471.8347016809663 315 L951.8347016809663 603" fill="none" stroke="#c56538" stroke-width="4" marker-end="url(#arrow)"/><circle cx="471.8347016809663" cy="315" r="8" fill="#f2f0e8" stroke="#b45b34" stroke-width="3"/><line x1="485.8347016809663" y1="315" x2="539.8347016809663" y2="315" stroke="#c56538" stroke-width="2" marker-end="url(#arrow)"/><text x="459.8347016809663" y="293" font-size="19" fill="#9d4e2b" font-weight="600">K0</text><circle cx="577.4347016809663" cy="378.36" r="8" fill="#f2f0e8" stroke="#b45b34" stroke-width="3"/><line x1="591.4347016809663" y1="378.36" x2="645.4347016809663" y2="378.36" stroke="#c56538" stroke-width="2" marker-end="url(#arrow)"/><text x="565.4347016809663" y="356.36" font-size="19" fill="#9d4e2b" font-weight="600">K1</text><circle cx="711.8347016809663" cy="459" r="8" fill="#f2f0e8" stroke="#b45b34" stroke-width="3"/><line x1="725.8347016809663" y1="459" x2="779.8347016809663" y2="459" stroke="#c56538" stroke-width="2" marker-end="url(#arrow)"/><text x="699.8347016809663" y="437" font-size="19" fill="#9d4e2b" font-weight="600">K2</text><circle cx="865.4347016809663" cy="551.16" r="8" fill="#f2f0e8" stroke="#b45b34" stroke-width="3"/><line x1="879.4347016809663" y1="551.16" x2="933.4347016809663" y2="551.16" stroke="#c56538" stroke-width="2" marker-end="url(#arrow)"/><text x="853.4347016809663" y="529.16" font-size="19" fill="#9d4e2b" font-weight="600">K3</text><circle cx="951.8347016809663" cy="603" r="8" fill="#f2f0e8" stroke="#b45b34" stroke-width="3"/><line x1="965.8347016809663" y1="603" x2="1019.8347016809663" y2="603" stroke="#c56538" stroke-width="2" marker-end="url(#arrow)"/><text x="939.8347016809663" y="581" font-size="19" fill="#9d4e2b" font-weight="600">K4</text><text x="370" y="274" font-size="21" fill="#9d4e2b" font-weight="600">起点 C0</text><text x="370" y="298" font-size="15" fill="#9d4e2b" font-weight="400">(0, 0, 1.784)</text><text x="885" y="651" font-size="20" fill="#9d4e2b" font-weight="600">终点 C4  (0, −1.20, −0.216)</text><text x="970" y="685" font-size="16" fill="#273f39" font-weight="400">距 AI 仍为1.784，恢复同一正面取景</text><path d="M900 457 L900 574" fill="none" stroke="#8b9b8b" stroke-dasharray="4 5"/><circle cx="900" cy="572" r="20" fill="none" stroke="#c56538" stroke-dasharray="4 4"/><text x="991" y="353" font-size="20" fill="#43584e" font-weight="400">①先从首页下沿下方经过</text><text x="991" y="385" font-size="20" fill="#43584e" font-weight="400">②再越过首页所在平面</text><text x="991" y="417" font-size="20" fill="#43584e" font-weight="400">③对准更深处 AI 停稳</text><text x="600" y="700" font-size="19" fill="#43584e" font-weight="400">相机不穿桌面；不俯看头顶；没有横移或掉头。</text><line x1="110" y1="770" x2="1490" y2="770" stroke="#9dab9e" marker-end="url(#arrow)"/><text x="110" y="806" font-size="16" fill="#273f39" font-weight="400">近处 / +z</text><text x="1384" y="806" font-size="16" fill="#273f39" font-weight="400">深处 / −z</text><line x1="180" y1="764" x2="180" y2="776" stroke="#9dab9e"/><text x="168" y="798" font-size="14" fill="#273f39" font-weight="400">3</text><line x1="420" y1="764" x2="420" y2="776" stroke="#9dab9e"/><text x="408" y="798" font-size="14" fill="#273f39" font-weight="400">2</text><line x1="660" y1="764" x2="660" y2="776" stroke="#9dab9e"/><text x="648" y="798" font-size="14" fill="#273f39" font-weight="400">1</text><line x1="900" y1="764" x2="900" y2="776" stroke="#9dab9e"/><text x="888" y="798" font-size="14" fill="#273f39" font-weight="400">0</text><line x1="1140" y1="764" x2="1140" y2="776" stroke="#9dab9e"/><text x="1128" y="798" font-size="14" fill="#273f39" font-weight="400">-1</text><line x1="1380" y1="764" x2="1380" y2="776" stroke="#9dab9e"/><text x="1368" y="798" font-size="14" fill="#273f39" font-weight="400">-2</text><line x1="42" y1="838" x2="1558" y2="838" stroke="#bcc8bc"/><text x="42" y="879" font-size="24" fill="#203c33" font-weight="600">端态保留原页，新增部分单独审阅</text><text x="42" y="916" font-size="18" fill="#43584e" font-weight="400">橙色虚线短边：候选首页下沿厚0.08、AI上沿厚0.05；仅短侧面，不新增四边完整展框。</text><text x="42" y="948" font-size="18" fill="#43584e" font-weight="400">绘画层次与画外延展尚待审计。此图只解释展页、相机与遮挡关系，不能证明人物已分层或运行效果已通过。</text><text x="42" y="980" font-size="18" fill="#43584e" font-weight="400">相机 C=(0, −1.20q, 1.784−2q)，视角35°、偏航/俯仰/滚转均为0；q由滚动进度平滑映射。</text></g></svg>