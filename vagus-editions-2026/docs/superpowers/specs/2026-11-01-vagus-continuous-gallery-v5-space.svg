<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img"><title>Vagus 空间侧视图</title><defs><linearGradient id="homeShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1d18" stop-opacity="0"/><stop offset="1" stop-color="#0c1d18" stop-opacity=".90"/></linearGradient><linearGradient id="floor" x1="0" y1="1" x2=".5" y2="0"><stop stop-color="#74523a"/><stop offset="1" stop-color="#b48e59"/></linearGradient><linearGradient id="depth" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#355b56"/><stop offset=".65" stop-color="#15382e"/><stop offset="1" stop-color="#09251e"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b45639"/></marker></defs><rect x="0" y="0" width="1440" height="950" fill="#f1f1e8" /><text x="40" y="53" font-size="34" fill="#173a34" font-family="STZhongsong, SimSun, serif" >空间与合成剖面：先展开画层，再向内走</text><text x="40" y="91" font-size="18" fill="#5b6d60" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >横向表示前后关系；两端原画是独立合成层，主相机只在新增展廊内前行。</text><rect x="80" y="180" width="260" height="340" fill="#d3e0d7" /><rect x="340" y="180" width="650" height="340" fill="#82998a" /><rect x="990" y="180" width="350" height="340" fill="#213d30" /><path d="M80 520H1340" fill="none" stroke="#74573c" stroke-width="16"/><path d="M340 180H990" fill="none" stroke="#3f6756" stroke-width="18"/><rect x="405" y="180" width="18" height="145" fill="#294d3e" /><rect x="423" y="180" width="11" height="145" fill="#bda77d" /><rect x="405" y="442" width="18" height="78" fill="#294d3e" /><rect x="423" y="442" width="11" height="78" fill="#bda77d" /><rect x="700" y="180" width="18" height="145" fill="#294d3e" /><rect x="718" y="180" width="11" height="145" fill="#bda77d" /><rect x="700" y="442" width="18" height="78" fill="#294d3e" /><rect x="718" y="442" width="11" height="78" fill="#bda77d" /><rect x="930" y="180" width="18" height="145" fill="#294d3e" /><rect x="948" y="180" width="11" height="145" fill="#bda77d" /><rect x="930" y="442" width="18" height="78" fill="#294d3e" /><rect x="948" y="442" width="11" height="78" fill="#bda77d" /><text x="97" y="218" font-size="24" fill="#173a34" font-family="STZhongsong, SimSun, serif" >首页艺术层</text><text x="548" y="218" font-size="24" fill="#f2f1df" font-family="STZhongsong, SimSun, serif" >新增连续环境</text><text x="1035" y="218" font-size="24" fill="#f2f1df" font-family="STZhongsong, SimSun, serif" >AI 艺术层</text><path d="M365 374H963" fill="none" stroke="#b45639" stroke-width="7" marker-end="url(#arrow)"/><circle cx="365" cy="374" r="10" fill="#f1f1e8" stroke="#b45639" stroke-width="4"/><text x="347" y="417" font-size="19" fill="#fff5dc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >K0 / K1</text><circle cx="665" cy="374" r="10" fill="#f1f1e8" stroke="#b45639" stroke-width="4"/><text x="647" y="417" font-size="19" fill="#fff5dc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >K2</text><circle cx="875" cy="374" r="10" fill="#f1f1e8" stroke="#b45639" stroke-width="4"/><text x="857" y="417" font-size="19" fill="#fff5dc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >K3</text><circle cx="945" cy="374" r="10" fill="#f1f1e8" stroke="#b45639" stroke-width="4"/><text x="927" y="417" font-size="19" fill="#fff5dc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >K4</text><path d="M365 374L470 308V440ZM945 374L980 347V401Z" fill="none" stroke="#f5ebc8" stroke-width="2"/><text x="95" y="565" font-size="19" fill="#173a34" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >开场合成：原首页</text><text x="548" y="565" font-size="18" fill="#173a34" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >K0 / K1 相机同位置；p≈.26 开始前进</text><text x="1100" y="565" font-size="19" fill="#173a34" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >到达合成：原 AI</text><text x="40" y="635" font-size="21" fill="#304f40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >1  首页采用非物理的绘画轮廓展开；新开口不是原房间里的真实门。</text><text x="40" y="684" font-size="21" fill="#304f40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >2  新墙缘有可见厚度，地面有连续方向；前进后近景从周边经过。</text><text x="40" y="733" font-size="21" fill="#304f40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >3  两端人物只用原角度和原接触关系；原画通过遮罩接力，不作为相机穿越的墙。</text><text x="40" y="782" font-size="21" fill="#304f40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >4  远处先由新环境承接；到达时近景遮住接缝，再按终态取景显露原 AI。</text><text x="40" y="831" font-size="21" fill="#304f40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >5  这是合成与相对深度示意；墙缘、地面、光线与接缝仍需新制和灰模验证。</text><text x="40" y="920" font-size="18" fill="#667a68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" >路线提案：浅青漫射光 → 暖木与中绿 → 深绿阅览室。HTML 始终属于屏幕，阅读时不随相机缩放。</text></svg>