<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280">
<title>Vagus 五个关键帧结构设计稿</title><desc>首页停留、退出首页、两幕交接、进入AI、AI阅读；几何角色仅为位置图例。</desc>
<style>text{font-family:'Microsoft YaHei',sans-serif;font-size:19px;fill:#ece9e0}.title{font-size:28px;font-weight:bold}.small{font-size:17px;fill:#b8bec3}.ink{fill:#273735}</style>
<defs>
<g id="home"><rect width="640" height="260" fill="#a4c5bd"/><path d="M380 110Q470 60 550 125L590 230H370Z" fill="#c7ac95"/><ellipse cx="478" cy="68" rx="38" ry="43" fill="#d1bba3"/><rect y="216" width="640" height="44" fill="#765740"/><rect x="360" y="169" width="96" height="47" fill="#c47d9c"/><rect x="546" y="184" width="25" height="32" fill="#c3bfae"/><ellipse cx="602" cy="201" rx="22" ry="15" fill="#76685a"/></g>
<g id="ai"><rect width="640" height="260" fill="#464739"/><path d="M330 30L297 215H397L371 30Z" fill="#676857"/><path d="M390 110Q480 70 558 125L593 227H380Z" fill="#b6aa92"/><ellipse cx="488" cy="70" rx="37" ry="43" fill="#c9bda5"/><rect y="216" width="640" height="44" fill="#6d5140"/><rect x="425" y="201" width="112" height="15" fill="#c8b896"/><rect x="459" y="158" width="28" height="43" fill="#df7047"/></g>
</defs>
<rect width="1440" height="1280" fill="#202429"/>
<text x="40" y="50" class="title">Vagus｜五个关键帧构图板</text><text x="40" y="84" class="small">2026-10-31 · 结构示意，非原画合成 · 几何人物/道具只标位置，不代表已有分层资产</text>
<text x="40" y="130" class="title">K0 · p=0 · 首页停留 / R</text><g transform="translate(40 150)"><use href="#home"/><text x="28" y="63" class="ink">Vagus / 原有介绍</text><text x="28" y="99" class="ink">Explore · Quick Browse · Resume</text><text x="28" y="24" class="ink">固定导航</text></g><text x="40" y="440">绘画原貌；HTML即刻可用；相机静止、框在视野外</text>
<text x="740" y="130" class="title">K1 · p=.25 · 退出首页 / S</text><rect x="740" y="150" width="640" height="260" fill="#171b20"/><g transform="translate(786 180) scale(.85 .77)"><use href="#home"/><rect width="640" height="260" fill="none" stroke="#b2a38b" stroke-width="12"/></g><text x="740" y="440">Three后退露框；猫、杯、阴影与承托桌面贴合</text>
<text x="40" y="510" class="title">K2 · p=.50 · 两幕交接 / S</text><rect x="40" y="530" width="640" height="260" fill="#171b20"/><svg x="40" y="530" width="640" height="260" viewBox="0 0 640 260"><g transform="translate(-476 28) scale(.88 .78)"><use href="#home"/><rect width="640" height="260" fill="none" stroke="#b2a38b" stroke-width="12"/></g><g transform="translate(160 22) scale(.74 .83)"><use href="#ai"/><rect width="640" height="260" fill="none" stroke="#b2a38b" stroke-width="12"/></g></svg><text x="40" y="821">← 首页残幅；AI从右进入；无双标题、无整图溶解</text><text x="40" y="851" class="small">本帧是同屏尾部；p=.40另查两画各半的状态</text>
<text x="740" y="510" class="title">K3 · p=.75 · 进入 AI / S</text><g transform="translate(740 530)"><use href="#ai"/><rect x="5" y="4" width="630" height="252" fill="none" stroke="#b2a38b" stroke-width="10"/><text x="30" y="88">AI行业观察</text></g><text x="740" y="821">沿法线推进；框越出四边；脸手手机古书不变形</text><text x="740" y="851" class="small">标题建立，简介入口待稳定；人物观看角度不改变</text>
<text x="40" y="925" class="title">K4 · p=1 · AI 阅读 / R</text><g transform="translate(40 945)"><use href="#ai"/><text x="28" y="30">固定导航</text><text x="32" y="76" class="title">AI行业观察</text><text x="32" y="111">既有连续简介（标位置）</text><text x="32" y="149">真实入口 1</text><text x="32" y="179">真实入口 2</text><text x="32" y="209">真实入口 3</text><text x="32" y="244">查看全部作品</text></g>
<text x="740" y="964" class="title">阅读排布与返回</text><text x="740" y="1004">左8%—38%文字；右52%—95%主体检查区</text><text x="740" y="1041">相机静止；文字可选中，链接立即可用</text><text x="740" y="1078">反滚同p返回；返回工作室为即时锚点</text><text x="740" y="1115">下方真实文章目录接正常文档流</text><text x="740" y="1152">实际简介、三入口与字体换行待核实</text><text x="740" y="1189" class="small">图例不代表正式图像、真实作品内容或视觉验收</text>
<text x="40" y="1252" class="small">完整路径/画质/素材/控制权见配套design-delivery.md；未制作网站、正式素材或连续动效。</text></svg>
