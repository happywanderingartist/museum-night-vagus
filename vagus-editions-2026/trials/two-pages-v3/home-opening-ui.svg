<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#07130f" stop-opacity=".95"/><stop offset=".5" stop-color="#07130f" stop-opacity=".65"/><stop offset="1" stop-color="#07130f" stop-opacity="0"/></linearGradient><linearGradient id="choice"><stop stop-color="#c6d8c2" stop-opacity=".12"/><stop offset="1" stop-color="#c6d8c2" stop-opacity="0"/></linearGradient></defs><rect y="590" width="1600" height="310" fill="url(#fade)"/><g fill="#1c3029" font-family="Microsoft YaHei,sans-serif"><text x="80" y="86"  font-size="56" font-family="Times New Roman,serif" letter-spacing="-3">Vagus</text><text x="270" y="64" font-family="DengXian,sans-serif" font-size="15" >让好奇心成为方法，让想象力成为作品。</text><text x="270" y="88" font-family="DengXian,sans-serif" font-size="12" opacity=".76">Curiosity as a method. Imagination made real.</text></g><g fill="#f1f0e8" font-family="Microsoft YaHei,sans-serif"><text x="80" y="760" font-family="DengXian,sans-serif" font-size="16" fill="#d8e2d3">蒙娜丽莎</text><text x="80" y="805" font-family="DengXian,sans-serif" font-size="24" >咋的，没看过名画上班吗？</text><text x="80" y="846" font-family="DengXian,sans-serif" font-size="13" >继续　▸</text></g><g fill="#f1f0e8" font-family="Microsoft YaHei,sans-serif"><text x="1252" y="738" font-family="DengXian,sans-serif" font-size="20" >速览作品</text><rect x="1222" y="756" width="250" height="48" fill="url(#choice)"/><text x="1228" y="788" font-family="DengXian,sans-serif" font-size="18" >▸</text><text x="1252" y="788" font-family="DengXian,sans-serif" font-size="20" >接受邀请</text><text x="1252" y="838" font-family="DengXian,sans-serif" font-size="20" >看看简历</text></g></svg>